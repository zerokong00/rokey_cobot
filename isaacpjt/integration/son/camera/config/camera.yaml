# 배관 점검 로봇 — 카메라 센서 파라미터
#
# RealSense 는 적용 불가로 판정되어 일반 Camera prim + 어안 투영으로 전환했다.
#   D455 최소 측정 거리 52cm  vs  관벽 거리 25mm  (20배 차이)
#   D455 본체 124x25x29mm     vs  세그먼트 62mm 내부
# Isaac Sim 이 제공하는 다른 depth 카메라 에셋도 전부 자율주행·서비스 로봇용이라
# 같은 문제가 있다. 실제 배관 점검 장비도 스테레오가 아니라 광각 보어스코프를 쓴다.
#
# 외형만 RealSense 형태(가로로 긴 바)를 유지한다. 시각용이며 물리 없음.

camera:
  # ── 배치 ──────────────────────────────────────────────────────
  # 두 카메라 모두 로봇 축선상. 단 수리기 전방은 토치 회전축과 간섭하므로
  # offset_mm 을 주고 그 값을 tf 에 반영해야 한다.
  # 🚨 본체 앞끝은 75 가 아니라 79.00mm 다. 세그먼트 62mm 만 센 값이 문서에
  # 남아 있었는데, build_parts.py 의 rounded_body() 가 양쪽에 캡을 붙이고
  # camera() 가 렌즈 돌기를 더해 body_front.stl 은 실제로 69mm 다.
  #     로컬 x -34.00 ~ +35.00  →  배치(+44) 후 월드 x +10.00 ~ +79.00
  # 74 에 두면 카메라가 본체 안으로 5.00mm 파묻혀 관을 전혀 못 본다.
  # 2026-08-04 실측: Depth 0~3.9mm, 관벽(45~55mm) 화소 0개, RGB 전 화소 검정.
  # 82 로 빼면 관벽 화소 153,645 개. 링(58~68)과도 안 겹친다.
  front:
    link: body_front
    axis: "+X"
    mount_x_mm: 82.0          # 본체 앞끝 79.00 + 여유 3
    offset_mm: [0.0, 0.0, 0.0]
  rear:
    link: body_rear
    axis: "-X"
    mount_x_mm: -82.0         # 후방도 대칭 (본체 뒤끝 -79.00)
    offset_mm: [0.0, 0.0, 0.0]
  welder_front_offset_mm: [0.0, 0.0, 12.0]   # 토치 간섭 회피용

  # ── 투영 ──────────────────────────────────────────────────────
  # 관 내부는 원통이라 화각이 넓을수록 관벽을 많이 본다.
  # 원형도 판정과 오프셋 측정 양쪽에 유리하다.
  # fisheyePolynomial 은 Isaac Sim 5.0 부터 폐기(OmniLensDistortion 이 대체).
  # Camera 클래스에서는 set_opencv_fisheye_properties 로 어안을 건다.
  projection: "opencv_fisheye"
  hfov_deg: 140.0
  # 오프라인 판정기가 쓰는 근사 모델. 등거리(equidistant) r = f*theta.
  # f_px 는 width/2 / (hfov/2 in rad) 로 유도되며 스크립트가 계산한다.
  offline_model: "fisheye_equidistant"

  # ── 클리핑 ────────────────────────────────────────────────────
  # 관벽까지 25mm. near 를 그보다 작게 잡지 않으면 근접 벽면이 통째로 잘린다.
  clipping_range_m: [0.005, 5.0]

  # ── 해상도·주기 ───────────────────────────────────────────────
  width: 1280
  height: 720
  publish_hz: 10.0            # 주행 0.1 m/s 에서 프레임당 10mm

  # ── 어노테이터 ────────────────────────────────────────────────
  # distance_to_image_plane 이 아니라 distance_to_camera 를 쓴다.
  # 관 내부는 방사형이라 광축 투영 거리가 아니라 실제 거리가 필요하다.
  annotators:
    - rgb
    - distance_to_camera
    - camera_params

  # ── 전송 ──────────────────────────────────────────────────────
  rgb_transport: "compressed"     # 두 PC 간 대역폭
  depth_transport: "raw"          # 32FC1. 손실 압축은 깊이값을 훼손한다

  # ── 토픽 ──────────────────────────────────────────────────────
  topics:
    rgb: "front/rgb"
    depth: "front/depth"
    camera_info: "front/camera_info"
    rear_rgb: "rear/rgb"
    rear_depth: "rear/depth"
    rear_camera_info: "rear/camera_info"

# ── 조명 ─────────────────────────────────────────────────────────
# 관 내부는 완전 암흑이라 로봇 탑재 조명이 유일한 광원이다.
light:
  type: "SphereLight"
  count_per_camera: 2
  radius_mm: 3.0
  ring_radius_mm: 14.0        # 카메라 광축에서 이 반경에 대칭 배치
  # 🚨 3e7 은 **카메라가 본체 안에 파묻혀 있던 상태**에서 정한 값이다.
  # "3e5 로는 밝기 중앙값 3/255" 라는 근거도 그 조건에서 나온 것이라,
  # 카메라를 본체 밖(82mm)으로 빼고 하우징을 물린 뒤에는 성립하지 않는다.
  #
  # 2026-08-04 관 내부 실측(직관 600mm, 로봇 조명만, 200스텝 안정화 후):
  #     3.0e7  중앙값 255.0  포화 59.9%   ← 관벽 질감이 통째로 날아간다
  #     5.0e5  중앙값 176.7  포화  0.1%
  #     4.0e5  중앙값 160.9  포화  0.1%   ← 채택 (3회 반복 161.0/159.7/162.0)
  #
  # ⚠ 조명을 바꾼 뒤 **35스텝으로는 렌더러가 수렴하지 않는다.** 같은 값이
  # 순서에 따라 167 과 52 로 갈렸다. 밝기를 잴 때는 200스텝 이상 돌릴 것.
  intensity: 4.0e5
  color_temp_k: 5000.0
  # Replicator 도메인 랜덤화 대상. 고정값으로 학습하면 일반화가 안 된다.
  # 채택값의 0.4~2배로 잡았다(종전 3e7 기준 비율을 그대로 옮김).
  randomize:
    intensity: [1.5e5, 8.0e5]
    color_temp_k: [3000.0, 7000.0]

# ── 진단 (camera_depth_probe.py 가 읽는다) ───────────────────────
probe:
  hole_diameter_mm: 60.0      # 배관에 의도적으로 뚫는 구멍
  hole_distance_mm: 220.0     # 카메라 앞 거리
  # 🚨 이 값은 **카메라 기준**이다. 설계서의 "관 내벽까지 25mm" 는 본체 표면
  # 기준(본체 반폭 25mm + 관벽 50mm)이라 그대로 쓰면 안 된다. 카메라는 관
  # 중심축에 있으므로(front/rear 모두 offset_mm [0,0,0]) 관벽은 항상 50mm 다.
  # 25 로 두면 35mm 미만 픽셀을 세게 되는데 그것은 기하학적으로 존재할 수
  # 없어 매번 오탐 경고가 떴다 — 2026-08-04 실기 실측 최소 45.73mm.
  # 카메라를 축에서 옮기면 (50 - 편심) 으로 다시 잡을 것.
  near_wall_mm: 50.0
  frames: 40
